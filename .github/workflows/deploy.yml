name: Test, Version Bump & Publish to npm

on:
  push:
    branches: [master]
  # Publishes the version on master as it is, without a bump: for a version that was
  # tagged but never reached npm.
  workflow_dispatch:

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: write
  # npm trusted publishing: the registry accepts this workflow's identity, so there is
  # no token to expire. Set up once on npmjs.com (package settings, Trusted Publisher).
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    if: "github.event_name == 'workflow_dispatch' || !startsWith(github.event.head_commit.message, 'chore: bump version')"

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.REPO_PAT }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      # Trusted publishing needs npm 11.5.1 or newer.
      - name: Update npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test

      # Committed and tagged here, pushed only after npm has the version.
      - name: Bump patch version
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          npm version patch --no-git-tag-version
          NEW_VERSION=$(node -p "require('./package.json').version")
          sed -i "s/export const PLUGIN_VERSION = .*/export const PLUGIN_VERSION = \"$NEW_VERSION\";/" src/version.ts
          npm run build
          git add package.json package-lock.json src/version.ts
          git commit -m "chore: bump version to $NEW_VERSION"
          git tag "v$NEW_VERSION"

      - name: Publish to npm
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "$NAME@$VERSION is already on npm"
          else
            npm publish --access public
          fi

      - name: Push the version bump
        if: github.event_name == 'push'
        run: |
          git push
          git push --tags
